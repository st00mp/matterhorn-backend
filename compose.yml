services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Forwarded from the host shell; extraction is skipped (logged error) if unset
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        # Wait until the DB is ready to accept connections, not just started
        condition: service_healthy

  postgres:
    image: postgres:17
    ports:
      # Published for local inspection only (IDE, psql); containers use the internal network
      - "5432:5432"
    environment:
      # These must match application-docker.properties
      POSTGRES_DB: matterhorn
      POSTGRES_USER: matterhorn
      POSTGRES_PASSWORD: matterhorn
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matterhorn -d matterhorn"]
      interval: 2s
      timeout: 3s
      retries: 15
